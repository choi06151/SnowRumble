name: Code Convention

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    name: Check Unreal C++ formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format

      - name: Check changed C++ files
        run: node Scripts/check-clang-format.mjs
